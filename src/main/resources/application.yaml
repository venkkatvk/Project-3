# Subsystem Name: Declarative Infrastructure Configuration Layer
# Domain Context: Environmental Environment Properties Group
# File Location: src/main/resources/application.yaml

spring:
  # 1. Framework Component Processing Directives
  main:
    allow-bean-definition-overriding: true

  application:
    name: enterprise-ai-gateway

  # 2. Relational Metadata Ledger Configuration (Addresses pgvector auto-configuration requirements)
  datasource:
    url: jdbc:postgresql://localhost:5432/gateway_metadata_vault
    username: enterprise_architect
    password: sacred_vault_password_2026
    driver-class-name: org.postgresql.Driver
  
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update

  # 3. High-Performance Containerized Cache Connection Coordinates
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms

  # 4. Federated Spring AI Subsystem Configuration Engine
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: gpt-4o
          temperature: 0.3

    # 5. Intelligent Semantic Index Target Boundaries
    vectorstore:
      redis:
        index: gateway-semantic-cache
        prefix: "ai:gateway:"
        initialize-schema: true

# Explicitly anchoring the behavioral thresholds for the llmPerimeterShield instance
resilience4j:
  circuitbreaker:
    instances:
      llmPerimeterShield:
        # Enforcing a sliding validation window based on transaction item counts
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        # If 50% of the last 10 requests collapse, trip the drawbridge to the OPEN state
        failureRateThreshold: 50
        # Wait 10000ms (10 seconds) in OPEN state before testing with HALF_OPEN scouts
        waitDurationInOpenState: 10000ms
        permittedNumberOfCallsInHalfOpenState: 3
        # Automatically capture execution context state-changes for debugging pools
        automaticTransitionFromOpenToHalfOpenEnabled: true

management:
  tracing:
    sampling:
      probability: 1.0
    otlp:
      tracing:
        endpoint: http://localhost:4317
        
      spring:
  application:
    name: enterprise-ai-gateway
  ai:
    openai:
      api-key: mock-key-for-local-threads
  autoconfigure:
    exclude:
      - org.springframework.ai.vectorstore.redis.autoconfigure.RedisVectorStoreAutoConfiguration
      - org.springframework.ai.vectorstore.pgvector.autoconfigure.PgVectorStoreAutoConfiguration