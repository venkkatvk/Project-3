spring:
  # 1. Core Framework Overriding Mechanism
  main:
    allow-bean-definition-overriding: true

  application:
    name: enterprise-ai-gateway

  # 2. Containerized Data Ledger Connection Coordinates
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms

  # 3. Spring AI Federated Ecosystem Configurator
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:sk-placeholder-token-for-local-build-validation}
      chat:
        options:
          model: gpt-4o
          temperature: 0.3

    # 4. Intelligent Semantic Index Target Boundaries
    vectorstore:
      redis:
        index: gateway-semantic-cache
        prefix: "ai:gateway:"
        initialize-schema: true